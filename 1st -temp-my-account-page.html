<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="1st -temp-my-account-page.css">
    <title>My-Account</title>
</head>
<body>
    <header>
        <div class="container flex">
            <nav class="main-nav">
              <div class="logo"></div>
              <div class="nav-right">
                    <label class="search-box">
                         <input type="text" placeholder="Search">
                         <div class="search-icon-box">
                            <i class="fa-solid fa-magnifying-glass search-icon"></i>
                         </div>
                    </label>
                <div class="notification-div">
                    <div class="notification-icon">
                        <i class="fa-regular fa-bell"></i>
                        <div class="notification-number">5</div>
                    </div>
                </div>
                <div class="profile-pick"></div>
              </div>
           </nav>
        </div>
    </header>
    <section class="my-account">
    <div class="container">
        <div class="main-ctrl">
            <div class="sec-left">
                <div class="inner-box">
                <div class="icon">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                  <p class="text">TV Series</p>
            </div>
                <div class="inner-box">
                <div class="icon">
                    <i class="fa-brands fa-spotify"></i>
                </div>
                  <p class="text">Play List</p>
            </div>
                <div class="inner-box">
                <div class="icon">
                    <i class="fa-solid fa-plane-arrival"></i>
                </div>
                  <p class="text">New Arrivales</p>
            </div>
                <div class="inner-box">
                <div class="icon">
                    <i class="fa-solid fa-face-smile-beam"></i>
                </div>
                  <p class="text">Animation</p>
            </div>
                <div class="inner-box">
                <div class="icon">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                  <p class="text">Talk Show</p>
            </div>
                <div class="inner-box">
                <div class="icon">
                    <i class="fa-solid fa-spinner"></i>
                </div>
                  <p class="text">comming soon ...</p>
            </div>
</div>
        <div class="sec-right">
            <div class="sec-right-nav">
                <div class="Account style ">
                <a href="#">Account details</a>
                </div>
                <div class="payment style">
                <a href="#">Payment Info</a>
                </div>
            </div>
            <div class="main-content-box">
                
            </div>

        </div>
</div>    
</div>
    </section>
    <footer class="container">footer</footer>
</body>
</html>
